[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "li-rads-liver-imaging-engine"
version = "2.0.0"
description = "LiverRADS Sentinel: CT/MRI LI-RADS Hepatocellular Carcinoma Diagnostic Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
li-rads-liver-imaging-engine = "li_rads_liver_imaging_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/li-rads-liver-imaging-engine"
Repository = "https://github.com/abusuraihsakhri/li-rads-liver-imaging-engine.git"
