name: Tests and security regressions

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Check dependency constraints
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q agents li_rads_liver_imaging_agent cli.py
      - name: Run Python regression tests
        run: python -m pytest -q
      - name: Check browser JavaScript
        run: node --check web/li-rads.mjs
      - name: Run browser decision-table unit tests
        run: node --test web/li-rads.test.mjs
